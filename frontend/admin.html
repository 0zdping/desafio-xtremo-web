<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Panel — Desafio Xtremo</title>
<meta name="robots" content="noindex">
<link rel="icon" type="image/png" sizes="32x32" href="assets/favicon-32.png">
<link rel="icon" type="image/png" sizes="16x16" href="assets/favicon-16.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@600;700;800&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/tokens.css">
<link rel="stylesheet" href="css/panel.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/marked/12.0.2/marked.min.js" integrity="sha512-xeUh+KxNyTufZOje++oQHstlMQ8/rpyzPuM+gjMFYK3z5ILJGE7l2NvYL+XfliKURMpBIKKp1XoPN/qswlSMFA==" crossorigin="anonymous" referrerpolicy="no-referrer"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/dompurify/3.1.5/purify.min.js" integrity="sha512-JatFEe90fJU2nrgf27fUz2hWRvdYrSlTEV8esFuqCtfiqWN8phkS1fUl/xCfYyrLDQcNf3YyS0V9hG7U4RHNmQ==" crossorigin="anonymous" referrerpolicy="no-referrer"></script>
<link href="https://cdnjs.cloudflare.com/ajax/libs/quill/2.0.2/quill.snow.min.css" rel="stylesheet" integrity="sha512-UmV2ARg2MsY8TysMjhJvXSQHYgiYSVPS5ULXZCsTP3RgiMmBJhf8qP93vEyJgYuGt3u9V6wem73b11/Y8GVcOg==" crossorigin="anonymous" referrerpolicy="no-referrer">
<script src="https://cdnjs.cloudflare.com/ajax/libs/quill/2.0.2/quill.min.js" integrity="sha512-1nmY9t9/Iq3JU1fGf0OpNCn6uXMmwC1XYX9a6547vnfcjCY1KvU9TE5e8jHQvXBoEH7hcKLIbbOjneZ8HCeNLA==" crossorigin="anonymous" referrerpolicy="no-referrer"></script>
</head>
<body>

<div class="scroll-progress" id="scroll-progress"></div>
<div id="field"></div>
<div class="nebula-field" id="nebula-field">
  <div class="nebula nebula-1"></div>
  <div class="nebula nebula-2"></div>
</div>
<div class="grain"></div>

<div id="panel-root">
  <div class="panel-denied">
    <p style="color:var(--text-dim);font-family:var(--f-mono);font-size:13px;">Cargando…</p>
  </div>
</div>

<template id="tpl-panel">
  <div class="panel-shell">
    <div class="panel-topbar">
      <a href="index.html" class="panel-brand"><img src="assets/wordmark.png" alt="Desafio Xtremo"><span class="divider-dot"></span>Panel</a>
      <div class="panel-topbar-right">
        <a href="index.html" class="panel-back">← Volver al sitio</a>
        <div class="panel-user">
          <img id="panel-user-avatar" src="" alt="">
          <span class="panel-user-name" id="panel-user-name"></span>
        </div>
      </div>
    </div>
    <div class="panel-body">
      <nav class="panel-sidebar">
        <button class="panel-nav-btn active" data-section="overview">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><rect x="3" y="3" width="7" height="9" rx="1.5"/><rect x="14" y="3" width="7" height="5" rx="1.5"/><rect x="14" y="12" width="7" height="9" rx="1.5"/><rect x="3" y="16" width="7" height="5" rx="1.5"/></svg>
          Resumen
        </button>
        <button class="panel-nav-btn" data-section="roles" id="nav-roles" hidden>
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M12 2l8 4v6c0 5-3.5 8.5-8 10-4.5-1.5-8-5-8-10V6l8-4z"/></svg>
          Rangos y permisos
        </button>
        <button class="panel-nav-btn" data-section="stats" id="nav-stats" hidden>
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M4 19h16M7 15l3.5-4.5L14 14l4.5-6"/><circle cx="7" cy="15" r="1.3" fill="currentColor" stroke="none"/><circle cx="10.5" cy="10.5" r="1.3" fill="currentColor" stroke="none"/><circle cx="14" cy="14" r="1.3" fill="currentColor" stroke="none"/><circle cx="18.5" cy="8" r="1.3" fill="currentColor" stroke="none"/></svg>
          Estadísticas
        </button>
        <button class="panel-nav-btn" data-section="usage" id="nav-usage" hidden>
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M4 19h16M7 19V9m5 10V5m5 14v-7"/></svg>
          Uso de recursos
        </button>
        <button class="panel-nav-btn" data-section="wiki" id="nav-wiki" hidden>
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M4 4.5C4 3.7 4.7 3 5.5 3H12v18H5.5c-.8 0-1.5-.7-1.5-1.5v-15z"/><path d="M20 4.5c0-.8-.7-1.5-1.5-1.5H12v18h6.5c.8 0 1.5-.7 1.5-1.5v-15z"/></svg>
          Wiki
        </button>
        <button class="panel-nav-btn" data-section="announcements" id="nav-announcements" hidden>
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M3 10v4a1 1 0 001 1h2l8 4V5L6 9H4a1 1 0 00-1 1z"/><path d="M17 9a4 4 0 010 6"/></svg>
          Anuncios
        </button>
        <button class="panel-nav-btn" data-section="team" id="nav-team" hidden>
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><circle cx="9" cy="8" r="3.2"/><path d="M2.5 20c0-3.3 2.9-6 6.5-6s6.5 2.7 6.5 6"/><circle cx="17" cy="8.5" r="2.6"/><path d="M16 14.2c2.6.5 4.5 2.6 4.5 5.3"/></svg>
          Equipo
        </button>
        <button class="panel-nav-btn" data-section="sanctions" id="nav-sanctions" hidden>
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M12 3l7 3v6c0 5-3.2 8-7 9-3.8-1-7-4-7-9V6l7-3z"/><path d="M12 8.5v4.2M12 16v.3"/></svg>
          Sanciones
        </button>
      </nav>

      <main class="panel-main">
        <section class="panel-section active" id="section-overview">
          <h1>Resumen</h1>
          <p class="panel-section-sub">Bienvenido de vuelta.</p>
          <div class="panel-card">
            <h2>Tus rangos</h2>
            <div class="role-perms" id="overview-roles"></div>
          </div>
        </section>

        <section class="panel-section" id="section-roles">
          <h1>Rangos y permisos</h1>
          <p class="panel-section-sub">Owner y Co-Owner tienen todos los permisos y no se pueden editar. Los demás rangos se crean con los permisos que necesiten.</p>
          <div id="roles-msg"></div>
          <div class="role-grid" id="roles-grid"></div>

          <div class="panel-card" id="role-form-card" hidden>
            <h2 id="role-form-title">Crear rango</h2>
            <div class="field-row">
              <label>Nombre</label>
              <input type="text" id="role-form-name" maxlength="40" placeholder="Ej: Moderador">
            </div>
            <div class="field-row">
              <label>Color</label>
              <div class="color-row">
                <input type="color" id="role-form-color" value="#6fb3ff">
                <span id="role-form-color-hex">#6fb3ff</span>
              </div>
            </div>
            <div class="field-row">
              <label>Posición (mayor = más arriba en la jerarquía)</label>
              <input type="number" id="role-form-position" value="0">
            </div>
            <div class="field-row">
              <label>Permisos</label>
              <div class="perm-checks" id="role-form-perms"></div>
            </div>
            <div class="form-actions">
              <button class="btn btn-accent btn-sm" id="role-form-save">Guardar</button>
              <button class="btn btn-ghost btn-sm" id="role-form-cancel">Cancelar</button>
            </div>
          </div>
          <button class="btn btn-ghost btn-sm" id="role-form-open">+ Crear rango</button>

          <div class="panel-card" style="margin-top:24px;">
            <h2>Asignar rango a un usuario</h2>
            <div class="user-search-row">
              <input type="text" id="user-search-input" placeholder="Buscar por username o pegar el ID de Discord…">
              <button class="btn btn-ghost btn-sm" id="user-search-btn">Buscar</button>
            </div>
            <div id="user-results"></div>
          </div>
        </section>

        <section class="panel-section" id="section-stats">
          <h1>Estadísticas</h1>
          <p class="panel-section-sub">Visitas, visitantes únicos y clics del sitio público. Sin cookies: cada visitante se cuenta con una huella anónima que rota cada día, nunca con su IP guardada.</p>

          <div class="stats-toolbar">
            <div class="stats-range" id="stats-range">
              <button data-range="today">Hoy</button>
              <button data-range="7d" class="active">7 días</button>
              <button data-range="30d">30 días</button>
              <button data-range="90d">90 días</button>
            </div>
          </div>

          <div id="stats-msg"></div>
          <div class="stats-kpis" id="stats-kpis"></div>

          <div class="panel-card stats-chart-card">
            <h2>Visitas en el tiempo</h2>
            <div class="stats-chart" id="stats-chart"></div>
          </div>

          <div class="stats-grid">
            <div class="panel-card">
              <h2>Páginas más vistas</h2>
              <div class="stats-barlist" id="stats-top-pages"></div>
            </div>
            <div class="panel-card">
              <h2>Clics más frecuentes</h2>
              <div class="stats-barlist" id="stats-top-clicks"></div>
            </div>
            <div class="panel-card">
              <h2>Origen del tráfico</h2>
              <div class="stats-barlist" id="stats-referrers"></div>
            </div>
            <div class="panel-card">
              <h2>Dispositivos</h2>
              <div class="stats-barlist" id="stats-devices"></div>
            </div>
            <div class="panel-card">
              <h2>Países</h2>
              <div class="stats-barlist" id="stats-countries"></div>
            </div>
          </div>
        </section>

        <section class="panel-section" id="section-usage">
          <h1>Uso de recursos</h1>
          <p class="panel-section-sub">Contadores propios contra los límites gratuitos de Cloudflare. Si un recurso llega al límite, las solicitudes que lo necesiten se bloquean automáticamente en vez de dejar que empiece a cobrarse.</p>
          <div class="usage-grid" id="usage-grid"></div>
        </section>

        <section class="panel-section" id="section-wiki">
          <h1>Wiki</h1>
          <p class="panel-section-sub">Páginas de la wiki pública del evento, organizadas por categoría.</p>
          <div id="wiki-msg"></div>
          <div class="role-grid" id="wiki-grid"></div>

          <div class="panel-card" id="wiki-form-card" hidden>
            <h2 id="wiki-form-heading">Crear página</h2>
            <div class="field-row">
              <label>Slug (identificador en la URL)</label>
              <input type="text" id="wiki-form-slug" maxlength="80" placeholder="Ej: reglas-generales">
            </div>
            <div class="field-row">
              <label>Título</label>
              <input type="text" id="wiki-form-title" maxlength="120" placeholder="Ej: Reglas generales">
            </div>
            <div class="field-row">
              <label>Categoría</label>
              <input type="text" id="wiki-form-category" maxlength="60" placeholder="Ej: Normas">
            </div>
            <div class="field-row">
              <label>Posición (orden dentro de la categoría)</label>
              <input type="number" id="wiki-form-position" value="0">
            </div>
            <div class="field-row">
              <label>Contenido (Markdown)</label>
              <textarea id="wiki-form-content" rows="10" placeholder="Escribe el contenido en Markdown…"></textarea>
            </div>
            <div class="field-row">
              <label>Vista previa</label>
              <div class="md-preview" id="wiki-form-preview"></div>
            </div>
            <div class="form-actions">
              <button class="btn btn-accent btn-sm" id="wiki-form-save">Guardar</button>
              <button class="btn btn-ghost btn-sm" id="wiki-form-cancel">Cancelar</button>
            </div>
          </div>
          <button class="btn btn-ghost btn-sm" id="wiki-form-open">+ Crear página</button>
        </section>

        <section class="panel-section" id="section-announcements">
          <h1>Anuncios</h1>
          <p class="panel-section-sub">Anuncios mostrados en el sitio público. Los fijados aparecen destacados arriba.</p>
          <div id="ann-msg"></div>
          <div class="role-grid" id="ann-grid"></div>

          <div class="panel-card" id="ann-form-card" hidden>
            <h2 id="ann-form-heading">Crear anuncio</h2>
            <div class="field-row">
              <label>Título</label>
              <input type="text" id="ann-form-title" maxlength="120" placeholder="Ej: Cambio de horario">
            </div>
            <div class="field-row">
              <label>Slug (URL)</label>
              <input type="text" id="ann-form-slug" maxlength="120" placeholder="se genera solo si lo dejas en blanco">
            </div>
            <div class="field-row">
              <label>Categoría</label>
              <input type="text" id="ann-form-category" maxlength="60" placeholder="Ej: Actualización">
            </div>
            <div class="field-row">
              <label>Extracto</label>
              <textarea id="ann-form-excerpt" rows="2" maxlength="220" placeholder="Resumen corto para la lista..."></textarea>
            </div>
            <div class="field-row">
              <label>Imagen de portada</label>
              <div class="hero-upload-row">
                <img id="ann-form-hero-preview" class="hero-upload-preview" hidden alt="Portada">
                <input type="file" id="ann-form-hero-input" accept="image/png,image/jpeg,image/webp,image/gif">
                <span class="hero-upload-status" id="ann-form-hero-status"></span>
              </div>
            </div>
            <div class="field-row checkbox-row">
              <label class="checkbox-inline"><input type="checkbox" id="ann-form-pinned"> Fijado (destacado arriba)</label>
            </div>
            <div class="field-row">
              <label>Cuerpo</label>
              <div id="ann-form-quill"></div>
            </div>
            <div class="form-actions">
              <button class="btn btn-accent btn-sm" id="ann-form-save">Guardar</button>
              <button class="btn btn-ghost btn-sm" id="ann-form-cancel">Cancelar</button>
            </div>
          </div>
          <button class="btn btn-ghost btn-sm" id="ann-form-open">+ Crear anuncio</button>
        </section>

        <section class="panel-section" id="section-team">
          <h1>Equipo</h1>
          <p class="panel-section-sub">Miembros de staff y desarrollo mostrados en el sitio público.</p>
          <div id="team-msg"></div>
          <div class="role-grid" id="team-grid"></div>

          <div class="panel-card" id="team-form-card" hidden>
            <h2 id="team-form-heading">Añadir miembro</h2>
            <div class="field-row team-form-nick-row">
              <div class="team-form-nick-fields">
                <label>Nick de Minecraft</label>
                <input type="text" id="team-form-nick" maxlength="32" placeholder="Ej: Steve123">
              </div>
              <img id="team-form-skin" class="team-skin-preview" src="" alt="Skin" hidden>
            </div>
            <div class="field-row">
              <label>Rango</label>
              <input type="text" id="team-form-rank" maxlength="40" placeholder="Ej: Administrador">
            </div>
            <div class="field-row">
              <label>Color del rango</label>
              <div class="color-row">
                <input type="color" id="team-form-color" value="#6fb3ff">
                <span id="team-form-color-hex">#6fb3ff</span>
              </div>
            </div>
            <div class="field-row">
              <label>Función</label>
              <input type="text" id="team-form-function" maxlength="80" placeholder="Ej: Organización general">
            </div>
            <div class="field-row">
              <label>Equipo</label>
              <select id="team-form-team">
                <option value="staff">Staff</option>
                <option value="dev">Desarrollo</option>
              </select>
            </div>
            <div class="field-row">
              <label>Posición (orden dentro del equipo)</label>
              <input type="number" id="team-form-position" value="0">
            </div>
            <div class="form-actions">
              <button class="btn btn-accent btn-sm" id="team-form-save">Guardar</button>
              <button class="btn btn-ghost btn-sm" id="team-form-cancel">Cancelar</button>
            </div>
          </div>
          <button class="btn btn-ghost btn-sm" id="team-form-open">+ Añadir miembro</button>
        </section>

        <section class="panel-section" id="section-sanctions">
          <h1>Sanciones</h1>
          <p class="panel-section-sub">Registro de sanciones aplicadas a jugadores, con pruebas adjuntas.</p>

          <div class="panel-card" id="sanction-form-card">
            <h2>Registrar sanción</h2>
            <div id="sanction-form-msg"></div>
            <div class="field-row">
              <label>Nick del jugador</label>
              <input type="text" id="sanction-form-nick" maxlength="32" placeholder="Ej: Steve123">
            </div>
            <div class="field-row">
              <label>Tipo</label>
              <select id="sanction-form-type">
                <option value="ban">Ban</option>
                <option value="mute">Mute</option>
                <option value="kick">Kick</option>
                <option value="warn">Warn</option>
                <option value="other">Otro</option>
              </select>
            </div>
            <div class="field-row">
              <label>Motivo</label>
              <textarea id="sanction-form-reason" rows="4" placeholder="Describe el motivo de la sanción…"></textarea>
            </div>
            <div class="field-row">
              <label>Pruebas (opcional, hasta 6 archivos — imágenes o vídeo)</label>
              <input type="file" id="sanction-form-files" multiple accept="image/*,video/mp4,video/webm">
            </div>
            <div class="form-actions">
              <button class="btn btn-accent btn-sm" id="sanction-form-save">Registrar sanción</button>
            </div>
          </div>

          <div id="sanctions-msg"></div>
          <div class="sanction-list" id="sanctions-list"></div>
        </section>
      </main>
    </div>
  </div>
</template>

<div id="zd-confirm-overlay" class="zd-confirm-overlay" hidden>
  <div class="zd-confirm-box">
    <p id="zd-confirm-message"></p>
    <div class="zd-confirm-actions">
      <button class="btn btn-ghost btn-sm" id="zd-confirm-cancel">Cancelar</button>
      <button class="btn btn-accent btn-sm" id="zd-confirm-ok">Eliminar</button>
    </div>
  </div>
</div>

<script src="js/site.js"></script>
<script src="js/admin.js"></script>
</body>
</html>
